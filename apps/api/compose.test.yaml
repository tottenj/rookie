services:
  postgres:
    image: postgres:17
    container_name: rookie-api-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: tester
      POSTGRES_DB: rookie_api_test
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d rookie_api_test']
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
