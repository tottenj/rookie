appId: com.jtotssteam.rookie.e2e
onFlowStart:
  - runFlow:
      file: ../../../subflows/utils/setup.yaml
---

- openLink: 'rookie-e2e://signin'
- assertVisible: 'Sign In'

- runFlow:
    file: ../../../subflows/auth/fill-in-signin-form.yaml
    env:
      EMAIL: '${MAESTRO_E2E_STANDARD_EMAIL}'
      PASSWORD: 'invalidpassword'

- assertVisible:
    text: 'Incorrect email or password.'
