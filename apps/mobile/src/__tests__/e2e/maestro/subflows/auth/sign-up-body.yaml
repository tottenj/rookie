appId: com.jtotssteam.rookie.e2e
---
- openLink: 'rookie-e2e://signup'

- assertVisible: 'Sign Up'

- tapOn:
    id: 'email-input'
- inputText: 'test@example.com'

- hideKeyboard

- tapOn:
    id: 'password-input'
- inputText: 'password123'

- hideKeyboard

- tapOn:
    id: 'confirmPassword-input'
- inputText: 'password123'

- hideKeyboard

- assertVisible:
    id: 'submit-button'

- tapOn:
    id: 'submit-button'
