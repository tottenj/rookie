appId: com.jtotssteam.rookie.e2e
---

- tapOn:
    id: 'email-input'

- inputText: ${EMAIL}

- hideKeyboard

- tapOn:
    id: 'password-input'

- inputText: ${PASSWORD}

- hideKeyboard

- tapOn:
    id: 'confirmPassword-input'


- inputText: ${CONFIRM_PASSWORD}

- hideKeyboard

- assertVisible:
    id: 'submit-button'

- tapOn:
    id: 'submit-button'
    enabled: true