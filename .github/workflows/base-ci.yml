name: CI
env:
  NODE_ENV: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/setup replaces both action-setup and setup-node for pnpm v11+
      - name: Setup pnpm & Node
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  api-unit-tests:
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true
      - run: pnpm prisma:generate
      - run: pnpm --filter @rookie/api run test:unit

  api-integration-tests:
    runs-on: ubuntu-latest
    needs: quality
    services:
      # Use GitHub Actions native service containers for Postgres instead of manual setup
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: tester
          POSTGRES_DB: rookie_api_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:tester@localhost:5434/rookie_api_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true
      - run: pnpm prisma:generate
      - run: pnpm --filter @rookie/api run test:integration:ci

  api-api-tests:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: tester
          POSTGRES_DB: rookie_api_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:tester@localhost:5434/rookie_api_test?schema=public
      FIREBASE_STORAGE_BUCKET: gs://rookie-a27a3.firebasestorage.app
      FIREBASE_PROJECT_ID: rookie-a27a3
      GCLOUD_PROJECT: rookie-dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true
      - run: pnpm prisma:generate
      - run: pnpm --filter @rookie/api run test:api:ci

  mobile-unit-tests:
    runs-on: ubuntu-latest
    needs: quality
    env:
      EXPO_PUBLIC_API_URL: https://rookie-api.fly.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true
      - run: pnpm --filter @rookie/mobile run test:unit

  mobile-integration-tests:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true
      - run: pnpm --filter @rookie/mobile run test:integration
